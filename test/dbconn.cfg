#数据库配置
[DATABASE]
DBType = mysql
DBHost = 127.0.0.1 #数据库服务器地址
DBPort = 4040	#数据库端口
DBUser = lsnms 	#数据库用户名
DBPassword = LSnms5712_Top # iV/TtpPiw2pMTiAtT7v14Q==    	#数据库密码(加密),请用lsassisthelp -H 密码明文 -T E 生成
Database = smartnms 	#数据库名
Charset = utf8mb4 	#数据库编码
MaxOpenConns = 300 	#MaxOpenConns用于设置最大打开的连接数，值为0表示不限制
MaxIdleConns = 300	#MaxIdleConns用于设置闲置的连接数,建议MaxOpenConns的值等于MaxIdleConns
ConnMaxLifetime = 150	#建议通过SetConnMaxLifetime来关闭空闲连接 (秒).给db设置一个超时时间，时间小于数据库的超时时间即可
ShowSQL=0

